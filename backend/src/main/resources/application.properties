spring.application.name=academic-rag-backend

# Carrega o .env da raiz do repositório como fonte de propriedades (opcional).
# "../.env" cobre a execução a partir de backend/ (./mvnw spring-boot:run);
# ".env" cobre a execução a partir da raiz (ex.: IDE). Variáveis de ambiente
# reais do sistema continuam tendo prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL (container do docker-compose, porta 5434 no host)
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI - ativação explícita dos provedores
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

# Spring AI - Google GenAI (Gemini API / AI Studio, não Vertex AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Spring AI - Google GenAI Embeddings
# gemini-embedding-001 gera 3072 dimensões por padrão, mas o índice HNSW do
# pgvector aceita no máximo 2000. Por isso fixamos 768 nos dois lados.
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Spring AI - PGvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
