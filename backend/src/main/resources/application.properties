spring.application.name=academic-rag-backend

# Carrega o .env da raiz do repositório como fonte de propriedades (opcional).
# "../.env" cobre a execução a partir de backend/ (./mvnw spring-boot:run);
# ".env" cobre a execução a partir da raiz (ex.: IDE). Variáveis de ambiente
# reais do sistema continuam tendo prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL (container do docker-compose, porta 5434 no host)
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI - ativação explícita dos provedores
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

# Spring AI - Google GenAI (Gemini API / AI Studio, não Vertex AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Spring AI - Google GenAI Embeddings
# gemini-embedding-001 gera 3072 dimensões por padrão, mas o índice HNSW do
# pgvector aceita no máximo 2000. Por isso fixamos 768 nos dois lados.
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Spring AI - PGvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# CORS - origens liberadas para chamar a API (separadas por vírgula)
app.cors.allowed-origins=http://localhost:5173

# Ingestão (Etapa 1) - parâmetros ajustáveis nos experimentos da Etapa 5
# Pasta dos PDFs, relativa ao diretório de execução (backend/ por padrão).
app.ingestion.docs-dir=../docs
# Tamanho máximo do chunk em tokens (tokenizer cl100k_base do TokenTextSplitter).
app.ingestion.chunk-size=800
# Tokens finais do chunk anterior (da mesma página) repetidos no início do próximo.
app.ingestion.chunk-overlap=100
# Chunks por chamada ao VectorStore (cada chamada gera os embeddings no Gemini). 15 x ~800 tokens = ~12k tokens.
app.ingestion.batch-size=15
# Pausa entre lotes, para respeitar o limite de 30k tokens/min do plano gratuito de embeddings. 0 desliga.
app.ingestion.batch-delay-ms=25000

# Chat (Etapa 2) - busca vetorial e regra de recusa
# Quantidade máxima de trechos recuperados por pergunta.
app.chat.top-k=4
# Similaridade mínima (1 - distância de cosseno) para um trecho entrar no contexto. Abaixo disso, recusa sem chamar o LLM.
app.chat.similarity-threshold=0.65
